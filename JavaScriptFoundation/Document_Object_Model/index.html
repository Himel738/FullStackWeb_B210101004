<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern To-Do App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-80 bg-white rounded-2xl shadow-lg overflow-hidden">

    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-500 to-purple-600 text-white text-center py-6">
      <h1 class="text-xl font-semibold">My Tasks</h1>
      <p class="text-sm opacity-90">Stay organized, stay productive</p>
    </div>

    <!-- Input -->
    <div class="p-4">
      <form id ="todo-form" class="flex items-center gap-2">
        <input name="todo" type="text" id ="todo-input" placeholder="What needs to be done?"
          class="flex-1 px-4 py-2 rounded-lg bg-gray-100 focus:outline-none"
          required>
        <button type="submit" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white w-10 h-10 rounded-lg text-xl">
          +
        </button>
      </form>
    </div>

    <!-- Tasks/ To-do List -->
    <div id="todo-list" class="px-4 space-y-3">

      <!-- Task 1 (regular Task) -->
      <div class="flex items-center justify-between bg-gray-100 px-3 py-2 rounded-lg">
        <div class="flex items-center gap-2">
          <input type="checkbox" class="w-5 h-5 accent-purple-500">
          <span>Complete the assignment</span>
        </div>
        <button class="text-gray-400 hover:text-red-500">🗑</button>
      </div>

      <!-- Task 2 (Completed) -->
      <div class="flex items-center justify-between bg-gray-100 px-3 py-2 rounded-lg">
        <div class="flex items-center gap-2">
          <input type="checkbox" checked class="w-5 h-5 accent-purple-500">
          <span class="line-through text-gray-400">Watch the tutorial video</span>
        </div>
        <button class="text-gray-400 hover:text-red-500">🗑</button>
      </div>

    </div>

    <!-- Footer -->
    <div class="flex justify-between items-center px-4 py-4 text-sm text-gray-500">
      <span>Total tasks: <span class="text-purple-500 font-semibold">0</span></span>
      <button class="text-blue-500 hover:underline">Clear completed</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
